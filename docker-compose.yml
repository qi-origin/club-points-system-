version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - club-data:/app/data
      - club-uploads:/app/server/uploads
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=change-this-to-a-random-string-in-production
    restart: unless-stopped

volumes:
  club-data:
  club-uploads:
